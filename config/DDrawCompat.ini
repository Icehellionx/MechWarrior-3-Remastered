# MechWarrior 3 faithful light-remaster preset v0.4
# DDrawCompat v0.7.1
#
# This repairs the top/left presentation edge, including the wider loading-frame
# footprint, and adds restrained range-limited sharpening plus neutral-gradient
# dithering. It preserves 4:3 geometry and deliberately applies no exposure or
# sky-brightening grade.

FullscreenMode = borderless
CpuAffinityRotation = off
AltTabFix = keepvidmem(1)
DisplayAspectRatio = 4:3
DisplayFilter = mw3-remaster\mw3-remaster.cgp:sharpness=0.180:deband_dither=0.250:remaster_mix=1.000
PresentationEdgeRepair = 4
RemasterIntroWidescreen = on
FpsLimiter = flipstart(30)
ResolutionScale = display(1)
ResolutionScaleFilter = bilinear
SupportedResolutions = 640x480, 1024x768
Antialiasing = msaa4x(0)
TextureFilter = af16x
LogLevel = info
